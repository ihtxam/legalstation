services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # Override on existing hosts that still use the legacy DB name/user.
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cliavo}
      MYSQL_USER: ${MYSQL_USER:-cliavo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cliavo}
    volumes:
      - cliavo_prod_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-mysql://cliavo:${MYSQL_PASSWORD:-cliavo}@mysql:3306/cliavo}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-saas}
      SINGLE_TENANT: ${SINGLE_TENANT:-false}
      DATA_RESIDENCY: ${DATA_RESIDENCY:-CH}
      LICENSE_KEY: ${LICENSE_KEY:-}
      LICENSE_SIGNING_SECRET: ${LICENSE_SIGNING_SECRET:-}
      VITE_APP_ID: ${VITE_APP_ID:-}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # Must match a verified Brevo sender (see Brevo → Senders)
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Cliavo}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ADYEN_API_KEY: ${ADYEN_API_KEY:-}
      ADYEN_MERCHANT_ACCOUNT: ${ADYEN_MERCHANT_ACCOUNT:-}
      ADYEN_ENVIRONMENT: ${ADYEN_ENVIRONMENT:-test}
      ADYEN_HMAC_KEY: ${ADYEN_HMAC_KEY:-}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DEMO_AUTH_ALLOW_PRODUCTION: ${DEMO_AUTH_ALLOW_PRODUCTION:-false}
      APP_URL: ${APP_URL:-}
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-}
      SUPERADMIN_BOOTSTRAP_SECRET: ${SUPERADMIN_BOOTSTRAP_SECRET:-}
      SCHEDULED_JOB_SECRET: ${SCHEDULED_JOB_SECRET:-}
      SCHEDULED_JOB_USER_ID: ${SCHEDULED_JOB_USER_ID:-1}
      RUN_DB_MIGRATE: "false"
      # Local-disk document storage (used when BUILT_IN_FORGE_* is not set)
      LOCAL_STORAGE_DIR: /app/data/storage
    volumes:
      - cliavo_prod_uploads:/app/data
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  # Prefer MYSQL_VOLUME_NAME=legacy MySQL volume name on hosts that already have data.
  cliavo_prod_mysql:
    name: ${MYSQL_VOLUME_NAME:-cliavo_prod_mysql}
  cliavo_prod_uploads:
    name: cliavo_prod_uploads
