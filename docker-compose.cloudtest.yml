# Override for nested/cloud VMs where Docker bridge hairpin is broken.
# Usage: docker compose -f docker-compose.yml -f docker-compose.cloudtest.yml up -d --build
services:
  db:
    network_mode: host
    environment:
      MYSQL_TCP_PORT: 3306
    ports: []

  minio:
    network_mode: host
    command: server /data --address ":9000" --console-address ":9001"
    ports: []

  minio-init:
    network_mode: host
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://127.0.0.1:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/$${S3_BUCKET:-lexflow} || true;
      exit 0;
      "
    depends_on: []

  migrate:
    network_mode: host
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-lexflow}:${MYSQL_PASSWORD:-lexflow}@127.0.0.1:3306/${MYSQL_DATABASE:-lexflow}
    depends_on: []

  app:
    network_mode: host
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-lexflow}:${MYSQL_PASSWORD:-lexflow}@127.0.0.1:3306/${MYSQL_DATABASE:-lexflow}
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_URL: http://127.0.0.1:9000/lexflow
    ports: []
    depends_on: []
